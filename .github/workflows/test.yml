name: test
on:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-gpu:
    runs-on: [slurm]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NVIDIA V100
            partition: defq
            gres: gpu:V100
          - name: NVIDIA A4000
            partition: defq
            gres: gpu:A4000
          - name: AMD W7700
            partition: rbq
            gres: gpu:W7700
    env:
      DEVICE_NAME: ${{ matrix.name }}
      PARTITION_NAME: ${{ matrix.partition }}
    steps:
      - uses: actions/checkout@v4
      - uses: astron-rd/slurm-action@v1.2
        with:
          partition: ${{ matrix.partition }}
          gres: ${{ matrix.gres }}
          time: "00:10:00"
          commands: |
            BUILD_DIR=$(mktemp -d -t build-XXXXXXXX)
            module load spack/2026.10.06
            if [[ "$DEVICE_NAME" == NVIDIA* ]]; then
              if [[ "$DEVICE_NAME" == *V100* ]]; then
                module load cuda/12.9.1
              else
                module load cuda
              fi
              cmake_flags=""
              append_path=""
            else
              cmake_flags="-DBUILD_WITH_HIP=1"
              append_path="/opt/rocm/bin"
            fi
            module load cmake
            PATH=$PATH:${append_path} cmake -S . -B ${BUILD_DIR} ${cmake_flags}
            make -C ${BUILD_DIR} -j
            ${BUILD_DIR}/benchmarks/benchmark-fp32
            ${BUILD_DIR}/benchmarks/benchmark-mma
